<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path2Web - P2P Federated Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb', // blue-600
                        secondary: '#475569', // slate-600
                        success: '#16a34a', // green-600
                        warning: '#ca8a04', // yellow-600
                        danger: '#dc2626', // red-600
                        dark: '#0f172a', // slate-900
                    }
                }
            }
        }
    </script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-dark text-white shadow-md z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center">
                <span class="text-xl font-bold tracking-tight">Path2Web</span>
                <span class="ml-3 px-2 py-0.5 rounded text-xs font-medium bg-blue-900 text-blue-100">AbMIL
                    Edition</span>
            </div>
            <div class="text-sm text-gray-400">P2P Federated Learning</div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex flex-1 overflow-hidden">

        <!-- Sidebar: Configuration & Controls -->
        <aside class="w-80 bg-white border-r border-gray-200 overflow-y-auto flex-shrink-0 z-0">
            <div class="p-6 space-y-8">

                <!-- Section 1: Data -->
                <div>
                    <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4">1. Data Loading</h3>
                    <div class="space-y-4">
                        <div>
                            <label for="jsonFiles" class="block text-sm font-medium text-gray-700 mb-1">Patch Embeddings
                                (JSON)</label>
                            <input type="file" id="jsonFiles" multiple accept=".json"
                                class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition-colors">
                            <p class="mt-1 text-xs text-gray-500">Select one or more JSON files.</p>
                        </div>
                        <button id="loadDataBtn"
                            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                            Load Data
                        </button>
                        <div id="dataStatus" class="text-sm text-gray-600"></div>
                    </div>
                </div>

                <hr class="border-gray-100">

                <!-- Section 2: Config -->
                <div>
                    <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4">2. Configuration</h3>
                    <div class="space-y-4">
                        <div>
                            <label for="labelProperty" class="block text-sm font-medium text-gray-700 mb-1">Label
                                Property</label>
                            <input type="text" id="labelProperty" value="gleason_score"
                                class="shadow-sm focus:ring-primary focus:border-primary block w-full sm:text-sm border-gray-300 rounded-md p-2 border">
                        </div>
                        <div>
                            <label for="maxPatches" class="block text-sm font-medium text-gray-700 mb-1">Max Patches /
                                Bag</label>
                            <input type="number" id="maxPatches" value="1000"
                                class="shadow-sm focus:ring-primary focus:border-primary block w-full sm:text-sm border-gray-300 rounded-md p-2 border">
                        </div>
                    </div>
                </div>

                <hr class="border-gray-100">

                <!-- Section 3: Training -->
                <div>
                    <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4">3. Federated Training
                    </h3>
                    <button id="trainBtn" disabled
                        class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-secondary hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
                        Start Training
                    </button>
                    <div class="mt-4">
                        <p class="text-sm font-medium text-gray-700">Status: <span id="training-status-text"
                                class="font-normal text-gray-600">Idle</span></p>
                    </div>

                    <!-- Progress Bar -->
                    <div id="progress-container" class="mt-2 hidden">
                        <div class="w-full bg-gray-200 rounded-full h-2.5 dark:bg-gray-700">
                            <div id="training-progress"
                                class="bg-blue-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%">
                            </div>
                        </div>
                        <p id="progress-text" class="text-xs text-right text-gray-500 mt-1"></p>
                    </div>
                </div>

            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="flex-1 flex flex-col min-w-0 bg-white">
            <!-- Plot Area -->
            <div class="flex-1 p-6 relative">
                <div class="absolute inset-0 p-6 pb-0 flex flex-col">
                    <h2 class="text-lg font-medium text-gray-900 mb-4">Training Convergence</h2>
                    <div id="convergencePlotContainer"
                        class="flex-1 border-2 border-dashed border-gray-200 rounded-lg flex items-center justify-center bg-gray-50">
                        <span class="text-gray-400 text-sm">Waiting for training metrics...</span>
                    </div>
                    <p id="convergenceStatusText" class="mt-2 text-sm text-gray-500 text-center h-5"></p>
                </div>
            </div>

            <!-- Logs / Terminal -->
            <div class="h-1/3 bg-slate-900 border-t border-gray-200 flex flex-col">
                <div class="flex items-center justify-between px-4 py-2 bg-slate-800 border-b border-slate-700">
                    <span class="text-xs font-medium text-gray-300 uppercase tracking-wider">System Logs</span>
                    <button id="clearLogsBtn" class="text-xs text-gray-400 hover:text-white">Clear</button>
                </div>
                <div class="flex-1 p-4 overflow-y-auto font-mono text-xs text-green-400 leading-relaxed"
                    id="results-output">
                    <span class="text-gray-500">> System ready. Waiting for data input...</span>
                </div>
            </div>
        </main>

    </div>

    <!-- Scripts -->
    <script src='https://cdn.jsdelivr.net/npm/plotly.js@3.0.1/dist/plotly.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs/dist/tf.min.js"> </script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgpu/dist/tf-backend-webgpu.js"></script>
    <script src="config.js"></script>
    <script src="app_abmil.js" type="module"></script>
    <script>
        document.getElementById('clearLogsBtn')?.addEventListener('click', () => {
            document.getElementById('results-output').innerHTML = '';
        });
    </script>
</body>

</html>
